name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check src tests ../scripts
      - run: uv run ruff format --check src tests ../scripts
      - run: uv run pytest
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --no-dev --no-hashes --frozen --no-emit-project -o /tmp/requirements.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  infra:
    name: Infra (tsc, vitest, cdk synth)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run: { working-directory: infra }
    env:
      # synth needs an environment but makes no AWS calls
      CDK_DEFAULT_ACCOUNT: "123456789012"
      CDK_DEFAULT_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: astral-sh/setup-uv@v6   # Lambda asset bundling uses uv (falls back to Docker otherwise)
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: cdk synth (CI config, full asset bundling)
        run: npx cdk synth --all -c config=ci/portal.config.json --no-notices --quiet
      - name: Bundled Lambda asset imports cleanly
        run: |
          asset=$(find cdk.out -maxdepth 2 -type d -name portal -path 'cdk.out/asset.*' | head -1 | xargs dirname)
          test -n "$asset"
          uv run --python ${{ env.PYTHON_VERSION }} --no-project python -I -c "import sys; sys.path.insert(0, '$asset'); import portal.handler, portal.presignup, portal.agreements, boto3; print('ok', boto3.__version__)"

  scripts:
    name: Scripts (--help smoke)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: for f in ../scripts/*.py; do case "$f" in */_common.py) continue;; esac; uv run python "$f" --help > /dev/null; done
